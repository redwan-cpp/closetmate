[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --strict-config
markers =
    slow: starts a subprocess or does real bcrypt work (still only a few seconds)
filterwarnings =
    # The app still uses Starlette's old HTTP_4xx status-constant names; not a test concern.
    ignore:'HTTP_[0-9]+_[A-Z_]+' is deprecated:DeprecationWarning
